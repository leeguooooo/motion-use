<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Placeholder container diagram. Replace it with the design document's own diagram (export the
       whiteboard as SVG), then run motion-use diagram boxes on it with into film.json (see SCRIPT.md).
       Style (C4 containers): dark blue = the user's side, blue = our services, grey dashed = not used by this design. -->
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <g id="client">
    <rect x="120" y="360" width="300" height="180" rx="18" fill="#1F3A68"/>
    <text x="270" y="450" font-family="sans-serif" font-size="34" fill="#FFFFFF" text-anchor="middle">客户端</text>
  </g>
  <g id="gateway">
    <rect x="650" y="360" width="300" height="180" rx="18" fill="#2F6FDE"/>
    <text x="800" y="450" font-family="sans-serif" font-size="34" fill="#FFFFFF" text-anchor="middle">网关</text>
  </g>
  <g id="service">
    <rect x="1180" y="200" width="300" height="180" rx="18" fill="#2F6FDE"/>
    <text x="1330" y="290" font-family="sans-serif" font-size="34" fill="#FFFFFF" text-anchor="middle">业务服务</text>
  </g>
  <g id="storage">
    <rect x="1180" y="560" width="300" height="180" rx="18" fill="#2F6FDE"/>
