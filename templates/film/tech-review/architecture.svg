  </g>
  <path id="request" d="M420 450 L650 450 L800 450 L1180 290" fill="none" stroke="#475467" stroke-width="4"/>
  <polyline id="write" points="1330,380 1330,560" fill="none" stroke="#475467" stroke-width="4"/>
